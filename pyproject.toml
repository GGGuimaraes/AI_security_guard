[project]
name = "ai_security_guard"
version = "0.1.0"
description = "Risk classification for a Tapo camera with a vision AI and alerts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses the real camera, OpenRouter or Telegram (run with -m live)",
    "bench: runs the reference video; no network, but needs the file (-m bench)",
]
addopts = "-m 'not live and not bench'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
